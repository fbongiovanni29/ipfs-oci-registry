{{- if and .Values.ipfs.deploy.enabled (eq .Values.ipfs.deploy.mode "daemonset") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oci-ipfs-registry.fullname" . }}-ipfs
  labels:
    {{- include "oci-ipfs-registry.labels" . | nindent 4 }}
    app.kubernetes.io/component: ipfs
spec:
  selector:
    matchLabels:
      {{- include "oci-ipfs-registry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ipfs
  template:
    metadata:
      labels:
        {{- include "oci-ipfs-registry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ipfs
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: configure-ipfs
          image: "{{ .Values.ipfs.deploy.image.repository }}:{{ .Values.ipfs.deploy.image.tag }}"
          command: ["/bin/sh", "/scripts/configure-ipfs.sh"]
          volumeMounts:
            - name: ipfs-data
              mountPath: /data/ipfs
            - name: scripts
              mountPath: /scripts
          env:
            - name: IPFS_PATH
              value: /data/ipfs
      containers:
        - name: ipfs
          image: "{{ .Values.ipfs.deploy.image.repository }}:{{ .Values.ipfs.deploy.image.tag }}"
          args:
            - daemon
            - --migrate=true
            - --enable-pubsub-experiment
          ports:
            - containerPort: 4001
              name: swarm
              hostPort: 4001
            - containerPort: 5001
              name: api
            - containerPort: 8080
              name: gateway
          env:
            - name: IPFS_PATH
              value: /data/ipfs
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: ipfs-data
              mountPath: /data/ipfs
            - name: scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.ipfs.deploy.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["ipfs", "id"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["ipfs", "id"]
            initialDelaySeconds: 30
            periodSeconds: 10
        # Sidecar for peer discovery
        - name: peer-discovery
          image: "{{ .Values.ipfs.deploy.image.repository }}:{{ .Values.ipfs.deploy.image.tag }}"
          command: ["/bin/sh", "/scripts/bootstrap-peers.sh"]
          env:
            - name: IPFS_PATH
              value: /data/ipfs
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: ipfs-data
              mountPath: /data/ipfs
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: scripts
          configMap:
            name: {{ include "oci-ipfs-registry.fullname" . }}-ipfs-config
            defaultMode: 0755
        - name: ipfs-data
          {{- if .Values.ipfs.deploy.persistence.enabled }}
          hostPath:
            path: {{ .Values.ipfs.deploy.persistence.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
