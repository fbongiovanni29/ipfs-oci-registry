{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oci-ipfs-registry.fullname" . }}
  labels:
    {{- include "oci-ipfs-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oci-ipfs-registry.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.extraEgress }}
    - Egress
    {{- end }}
  ingress:
    # Allow traffic to registry port
    - ports:
        - port: 5000
          protocol: TCP
      {{- if or .Values.networkPolicy.ingressNamespaceSelector .Values.networkPolicy.ingressPodSelector }}
      from:
        {{- if .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
        {{- end }}
        {{- if .Values.networkPolicy.ingressPodSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressPodSelector | nindent 14 }}
        {{- end }}
      {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.extraEgress }}
  egress:
    {{- toYaml .Values.networkPolicy.extraEgress | nindent 4 }}
  {{- end }}
{{- end }}
