{{- if eq .Values.registry.mode "daemonset" }}
# Headless service for registry peer discovery
# Each registry instance can discover others via DNS
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oci-ipfs-registry.fullname" . }}-headless
  labels:
    {{- include "oci-ipfs-registry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "oci-ipfs-registry.selectorLabels" . | nindent 4 }}
{{- end }}
