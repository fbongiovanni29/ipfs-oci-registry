# Docker Compose configuration
# IPFS hostname resolves to the ipfs service

server:
  address: "0.0.0.0:5000"

storage:
  database: /data/registry.db
  temp_dir: /data/uploads

ipfs:
  api_url: http://ipfs:5001
  timeout: 30s
  pin_content: true

federation:
  enabled: true
  topic: /oci-registry/v1/mappings
  query_timeout: 500ms
  announce_new_content: true
  share_pushed_images: false
  share_upstream_images: true
  tag_ttl: 5m

upstreams:
  docker.io:
    url: https://registry-1.docker.io
    auth:
      type: bearer
      token_url: https://auth.docker.io/token
      service: registry.docker.io

  ghcr.io:
    url: https://ghcr.io
    auth:
      type: bearer
      token_url: https://ghcr.io/token
      service: ghcr.io

  gcr.io:
    url: https://gcr.io
    auth:
      type: bearer
      token_url: https://gcr.io/v2/token
      service: gcr.io

  quay.io:
    url: https://quay.io
    auth:
      type: bearer
      token_url: https://quay.io/v2/auth
      service: quay.io

  # Google Artifact Registry
  us-docker.pkg.dev:
    url: https://us-docker.pkg.dev
    auth:
      type: bearer
      token_url: https://us-docker.pkg.dev/v2/token
      service: us-docker.pkg.dev

  # AWS ECR Public
  public.ecr.aws:
    url: https://public.ecr.aws
    auth:
      type: bearer
      token_url: https://public.ecr.aws/token
      service: public.ecr.aws

  # Microsoft Container Registry
  mcr.microsoft.com:
    url: https://mcr.microsoft.com
    auth:
      type: bearer
      token_url: https://mcr.microsoft.com/v2/token
      service: mcr.microsoft.com

metrics:
  enabled: true
  path: /metrics

logging:
  level: info
  format: json
